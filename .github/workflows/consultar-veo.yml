name: Consultar Veo

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  consultar:
    name: Consultar videos en curso
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Consultar la cola privada de Veo
        env:
          CRON_SECRET: ${{ secrets.KRIPTA_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta el secret KRIPTA_CRON_SECRET en este repositorio."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 90 --retry 2 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "https://main-monsterland.vercel.app/api/automatizacion/poll"
